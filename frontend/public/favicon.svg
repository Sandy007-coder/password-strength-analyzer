<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#33ccff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <radialGradient id="innerFill" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="rgba(0,180,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(2,6,15,0.95)"/>
    </radialGradient>
  </defs>

  <!-- Shield body -->
  <path
    d="M16 2 L28 7 L28 17 C28 24 23 29 16 31 C9 29 4 24 4 17 L4 7 Z"
    fill="url(#innerFill)"
    stroke="url(#shieldGrad)"
    stroke-width="1.25"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Inner shield ring -->
  <path
    d="M16 5 L26 9.5 L26 17 C26 22.5 22 27 16 28.5 C10 27 6 22.5 6 17 L6 9.5 Z"
    fill="none"
    stroke="rgba(0,180,255,0.18)"
    stroke-width="0.5"
    stroke-linejoin="round"
  />

  <!-- Checkmark -->
  <polyline
    points="10,16 14,20 22,12"
    stroke="#00ffa3"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Corner accents -->
  <line x1="4"  y1="7"  x2="7"  y2="7"  stroke="#00b4ff" stroke-width="0.75" opacity="0.45"/>
  <line x1="4"  y1="7"  x2="4"  y2="10" stroke="#00b4ff" stroke-width="0.75" opacity="0.45"/>
  <line x1="28" y1="7"  x2="25" y2="7"  stroke="#00b4ff" stroke-width="0.75" opacity="0.45"/>
  <line x1="28" y1="7"  x2="28" y2="10" stroke="#00b4ff" stroke-width="0.75" opacity="0.45"/>
</svg>