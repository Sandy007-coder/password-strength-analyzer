<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#33ccff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <radialGradient id="innerFill" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="rgba(0,180,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(5,14,31,0.98)"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#33ccff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </radialGradient>
  </defs>

  <!-- Outer shield -->
  <path
    d="M16 2 L28 7 L28 17 C28 23 22 29 16 31 C10 29 4 23 4 17 L4 7 Z"
    fill="url(#innerFill)"
    stroke="url(#shieldGrad)"
    stroke-width="1.25"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Inner shield ring -->
  <path
    d="M16 8 L22 11 L22 17 C22 21 19 24 16 25 C13 24 10 21 10 17 L10 11 Z"
    fill="none"
    stroke="rgba(0,180,255,0.25)"
    stroke-width="0.75"
    stroke-linejoin="round"
  />

  <!-- Center dot -->
  <circle
    cx="16" cy="16" r="3.5"
    fill="url(#dotGlow)"
    filter="url(#glow)"
  />

  <!-- Dot inner highlight -->
  <circle
    cx="15.2" cy="15.2" r="1"
    fill="rgba(255,255,255,0.35)"
  />

  <!-- Corner accents -->
  <line x1="4"  y1="7"  x2="7"  y2="7"  stroke="#00b4ff" stroke-width="0.75" opacity="0.4"/>
  <line x1="4"  y1="7"  x2="4"  y2="10" stroke="#00b4ff" stroke-width="0.75" opacity="0.4"/>
  <line x1="28" y1="7"  x2="25" y2="7"  stroke="#00b4ff" stroke-width="0.75" opacity="0.4"/>
  <line x1="28" y1="7"  x2="28" y2="10" stroke="#00b4ff" stroke-width="0.75" opacity="0.4"/>
</svg>