<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="centerPulse" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="rgba(0,180,255,0.08)"/>
      <stop offset="60%"  stop-color="rgba(0,180,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(0,180,255,0)"/>
    </radialGradient>
    <radialGradient id="topLeftGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="rgba(0,180,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(0,180,255,0)"/>
    </radialGradient>
    <radialGradient id="bottomRightGlow" cx="100%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="rgba(0,255,163,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,255,163,0)"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="50%"  stop-color="rgba(0,180,255,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="900" fill="#02060f"/>

  <!-- Ambient glow layers -->
  <rect width="1440" height="900" fill="url(#centerPulse)"/>
  <rect width="1440" height="900" fill="url(#topLeftGlow)"/>
  <rect width="1440" height="900" fill="url(#bottomRightGlow)"/>

  <!-- Grid lines — vertical -->
  <g stroke="rgba(0,180,255,0.055)" stroke-width="0.75">
    <line x1="60"   y1="0" x2="60"   y2="900"/>
    <line x1="120"  y1="0" x2="120"  y2="900"/>
    <line x1="180"  y1="0" x2="180"  y2="900"/>
    <line x1="240"  y1="0" x2="240"  y2="900"/>
    <line x1="300"  y1="0" x2="300"  y2="900"/>
    <line x1="360"  y1="0" x2="360"  y2="900"/>
    <line x1="420"  y1="0" x2="420"  y2="900"/>
    <line x1="480"  y1="0" x2="480"  y2="900"/>
    <line x1="540"  y1="0" x2="540"  y2="900"/>
    <line x1="600"  y1="0" x2="600"  y2="900"/>
    <line x1="660"  y1="0" x2="660"  y2="900"/>
    <line x1="720"  y1="0" x2="720"  y2="900"/>
    <line x1="780"  y1="0" x2="780"  y2="900"/>
    <line x1="840"  y1="0" x2="840"  y2="900"/>
    <line x1="900"  y1="0" x2="900"  y2="900"/>
    <line x1="960"  y1="0" x2="960"  y2="900"/>
    <line x1="1020" y1="0" x2="1020" y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="1140" y1="0" x2="1140" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1260" y1="0" x2="1260" y2="900"/>
    <line x1="1320" y1="0" x2="1320" y2="900"/>
    <line x1="1380" y1="0" x2="1380" y2="900"/>
  </g>

  <!-- Grid lines — horizontal -->
  <g stroke="rgba(0,180,255,0.055)" stroke-width="0.75">
    <line x1="0" y1="60"  x2="1440" y2="60"/>
    <line x1="0" y1="120" x2="1440" y2="120"/>
    <line x1="0" y1="180" x2="1440" y2="180"/>
    <line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="420" x2="1440" y2="420"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="540" x2="1440" y2="540"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="660" x2="1440" y2="660"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="0" y1="780" x2="1440" y2="780"/>
    <line x1="0" y1="840" x2="1440" y2="840"/>
  </g>

  <!-- Bright grid accent lines -->
  <line x1="720" y1="0"   x2="720"  y2="900" stroke="rgba(0,180,255,0.1)"  stroke-width="1"/>
  <line x1="0"   y1="450" x2="1440" y2="450" stroke="rgba(0,180,255,0.1)"  stroke-width="1"/>

  <!-- Floating hex shapes — top left cluster -->
  <g opacity="0.12" stroke="#00b4ff" stroke-width="0.75" fill="none">
    <polygon points="80,80 100,68 120,80 120,104 100,116 80,104"/>
    <polygon points="140,50 155,41 170,50 170,68 155,77 140,68"/>
    <polygon points="60,130 78,119 96,130 96,152 78,163 60,152"/>
    <polygon points="110,150 125,141 140,150 140,168 125,177 110,168"/>
  </g>

  <!-- Floating hex shapes — bottom right cluster -->
  <g opacity="0.1" stroke="#00ffa3" stroke-width="0.75" fill="none">
    <polygon points="1300,780 1320,768 1340,780 1340,804 1320,816 1300,804"/>
    <polygon points="1360,750 1375,741 1390,750 1390,768 1375,777 1360,768"/>
    <polygon points="1280,830 1298,819 1316,830 1316,852 1298,863 1280,852"/>
    <polygon points="1330,820 1345,811 1360,820 1360,838 1345,847 1330,838"/>
  </g>

  <!-- Floating hex shapes — top right -->
  <g opacity="0.08" stroke="#00b4ff" stroke-width="0.75" fill="none">
    <polygon points="1320,60 1340,48 1360,60 1360,84 1340,96 1320,84"/>
    <polygon points="1370,90 1385,81 1400,90 1400,108 1385,117 1370,108"/>
    <polygon points="1290,100 1308,89 1326,100 1326,122 1308,133 1290,122"/>
  </g>

  <!-- Floating hex shapes — bottom left -->
  <g opacity="0.08" stroke="#00b4ff" stroke-width="0.75" fill="none">
    <polygon points="60,780 80,768 100,780 100,804 80,816 60,804"/>
    <polygon points="110,810 125,801 140,810 140,828 125,837 110,828"/>
    <polygon points="40,830 58,819 76,830 76,852 58,863 40,852"/>
  </g>

  <!-- Data stream lines — left side -->
  <g opacity="0.15" stroke="#00b4ff" stroke-width="0.5" stroke-dasharray="4 8">
    <line x1="30"  y1="200" x2="30"  y2="700"/>
    <line x1="50"  y1="150" x2="50"  y2="600"/>
  </g>

  <!-- Data stream lines — right side -->
  <g opacity="0.15" stroke="#00b4ff" stroke-width="0.5" stroke-dasharray="4 8">
    <line x1="1410" y1="200" x2="1410" y2="700"/>
    <line x1="1390" y1="250" x2="1390" y2="750"/>
  </g>

  <!-- Scan line accent -->
  <rect x="0" y="449" width="1440" height="2" fill="url(#scanLine)" opacity="0.4"/>

  <!-- Corner bracket accents — all four corners -->
  <g stroke="#00b4ff" stroke-width="1.5" opacity="0.3">
    <!-- Top left -->
    <line x1="24" y1="24" x2="64" y2="24"/>
    <line x1="24" y1="24" x2="24" y2="64"/>
    <!-- Top right -->
    <line x1="1416" y1="24" x2="1376" y2="24"/>
    <line x1="1416" y1="24" x2="1416" y2="64"/>
    <!-- Bottom left -->
    <line x1="24" y1="876" x2="64"   y2="876"/>
    <line x1="24" y1="876" x2="24"   y2="836"/>
    <!-- Bottom right -->
    <line x1="1416" y1="876" x2="1376" y2="876"/>
    <line x1="1416" y1="876" x2="1416" y2="836"/>
  </g>

  <!-- Dot matrix — subtle scattered points -->
  <g fill="#00b4ff">
    <circle cx="240"  cy="180" r="1" opacity="0.2"/>
    <circle cx="480"  cy="120" r="1" opacity="0.15"/>
    <circle cx="720"  cy="240" r="1" opacity="0.2"/>
    <circle cx="960"  cy="120" r="1" opacity="0.15"/>
    <circle cx="1200" cy="180" r="1" opacity="0.2"/>
    <circle cx="360"  cy="660" r="1" opacity="0.15"/>
    <circle cx="600"  cy="720" r="1" opacity="0.2"/>
    <circle cx="840"  cy="660" r="1" opacity="0.15"/>
    <circle cx="1080" cy="720" r="1" opacity="0.2"/>
    <circle cx="180"  cy="420" r="1" opacity="0.12"/>
    <circle cx="1260" cy="420" r="1" opacity="0.12"/>
  </g>
</svg>