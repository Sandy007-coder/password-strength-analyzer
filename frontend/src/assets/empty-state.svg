<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#33ccff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <radialGradient id="shieldFill" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="rgba(0,180,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(2,6,15,0)"/>
    </radialGradient>
    <radialGradient id="platformGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(0,180,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,180,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="120" cy="100" rx="100" ry="80" fill="url(#platformGlow)"/>

  <!-- Floating dots — decorative -->
  <circle cx="30"  cy="40"  r="1.5" fill="#00b4ff" opacity="0.3"/>
  <circle cx="210" cy="60"  r="1.5" fill="#00b4ff" opacity="0.3"/>
  <circle cx="20"  cy="150" r="1"   fill="#00b4ff" opacity="0.2"/>
  <circle cx="220" cy="140" r="1"   fill="#00b4ff" opacity="0.2"/>
  <circle cx="55"  cy="170" r="1"   fill="#00ffa3" opacity="0.2"/>
  <circle cx="185" cy="170" r="1"   fill="#00ffa3" opacity="0.2"/>

  <!-- Dashed orbit ring -->
  <circle
    cx="120" cy="90"
    r="72"
    stroke="rgba(0,180,255,0.1)"
    stroke-width="1"
    stroke-dasharray="4 6"
  />

  <!-- Shield body -->
  <g transform="translate(120,90)" filter="url(#softGlow)">
    <path
      d="M0 -52 L38 -34 L38 8 C38 32 22 48 0 56 C-22 48 -38 32 -38 8 L-38 -34 Z"
      fill="url(#shieldFill)"
      stroke="url(#shieldGrad)"
      stroke-width="1.5"
      stroke-linejoin="round"
      opacity="0.5"
    />
    <!-- Inner shield ring -->
    <path
      d="M0 -42 L30 -26 L30 8 C30 26 17 40 0 47 C-17 40 -30 26 -30 8 L-30 -26 Z"
      fill="none"
      stroke="rgba(0,180,255,0.15)"
      stroke-width="0.75"
      stroke-linejoin="round"
    />
  </g>

  <!-- Question mark inside shield -->
  <text
    x="120" y="100"
    text-anchor="middle"
    font-family="'Orbitron', monospace"
    font-size="32"
    font-weight="700"
    fill="rgba(0,180,255,0.2)"
    filter="url(#glow)"
  >
    ?
  </text>

  <!-- Bottom platform -->
  <ellipse
    cx="120" cy="168"
    rx="52" ry="6"
    fill="rgba(0,180,255,0.06)"
    stroke="rgba(0,180,255,0.15)"
    stroke-width="0.75"
  />

  <!-- Vertical stem connecting shield to platform -->
  <line
    x1="120" y1="146"
    x2="120" y2="162"
    stroke="rgba(0,180,255,0.15)"
    stroke-width="1"
    stroke-dasharray="2 3"
  />

  <!-- NO RECORDS label -->
  <text
    x="120" y="190"
    text-anchor="middle"
    font-family="'Orbitron', monospace"
    font-size="9"
    font-weight="600"
    letter-spacing="4"
    fill="rgba(45,90,122,0.7)"
  >
    NO RECORDS FOUND
  </text>

  <!-- Corner brackets -->
  <line x1="8"   y1="8"   x2="20"  y2="8"   stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="8"   y1="8"   x2="8"   y2="20"  stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="232" y1="8"   x2="220" y2="8"   stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="232" y1="8"   x2="232" y2="20"  stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="8"   y1="196" x2="20"  y2="196" stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="8"   y1="196" x2="8"   y2="184" stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="232" y1="196" x2="220" y2="196" stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
  <line x1="232" y1="196" x2="232" y2="184" stroke="#00b4ff" stroke-width="1" opacity="0.2"/>
</svg>